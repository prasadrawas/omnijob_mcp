[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnijob-mcp"
version = "1.0.0"
description = "Universal 7-Platform Model Context Protocol Server for Naukri, Hirist, Wellfound, Instahyre, Cutshort, Greenhouse, and Foundit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prasad Rawas", email = "contactprasadrawas@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "job-search",
    "job-applications",
    "naukri",
    "hirist",
    "wellfound",
    "instahyre",
    "cutshort",
    "greenhouse",
    "foundit",
    "ats",
    "fastmcp",
    "ai-agent"
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.35.0",
    "pypdf>=3.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
omnijob-mcp = "omnijob_mcp.__main__:main"

[tool.setuptools]
package-dir = {"omnijob_mcp" = "."}

[tool.setuptools.packages.find]
where = ["."]
